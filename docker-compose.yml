services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sozan
      POSTGRES_PASSWORD: sozan
      POSTGRES_DB: sozan_ads
    ports:
      - "5432:5432"
    volumes:
      - sozan_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  sozan_pg:
