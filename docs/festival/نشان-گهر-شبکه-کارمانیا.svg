    <path d="M100 62 L100 168"/>
  </g>
  <!-- network nodes on facet joints -->
  <g fill="url(#g2)" stroke="#0E3F4A" stroke-width="2">
    <circle cx="78" cy="36" r="6"/>
    <circle cx="122" cy="36" r="6"/>
    <circle cx="52" cy="62" r="6"/>
    <circle cx="148" cy="62" r="6"/>
