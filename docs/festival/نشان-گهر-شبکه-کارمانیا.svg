<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B6B78"/>
      <stop offset="1" stop-color="#0E3F4A"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2B35C"/>
      <stop offset="1" stop-color="#B9802F"/>
    </linearGradient>
  </defs>
  <!-- gem silhouette: crown (top) + pavilion (bottom) -->
  <path d="M52 62 L78 36 H122 L148 62 L100 168 Z" fill="url(#g1)"/>
