name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      # Every tracked file must have exactly one owner role (docs/agents).
      - run: python3 tools/agent_context/build.py --check
      # Same command as deploy/deploy-api.sh; STATE_DIR keeps background writes out of backend/data.
      - name: unit tests
        working-directory: backend
        run: |
          export STATE_DIR="$(mktemp -d)" SOZAN_OBSERVE_OUTBOX=0
          PYTHONPATH=. python -m unittest discover -s app -p '*_test.py' -t .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
