map $host $sozan_static_root {
    default "";
    azmaish-panl.sozan-core.ir /home/ubuntu/site-builder/builds/azmaish-panl/.next/static;
    sozan-shop.sozan-core.ir /home/ubuntu/site-builder/builds/sozan-shop/.next/static;
    cahrm-srai-pars.sozan-core.ir /home/ubuntu/site-builder/builds/cahrm-srai-pars/.next/static;
    gahhoeh-rasta.sozan-core.ir /home/ubuntu/site-builder/builds/gahhoeh-rasta/.next/static;
    baby-shop.sozan-core.ir /home/ubuntu/site-builder/builds/baby-shop/.next/static;
    sahhr-kif.sozan-core.ir /home/ubuntu/site-builder/builds/sahhr-kif/.next/static;
}

map $host $sozan_upstream {
    default "";
    sozan-core.ir 127.0.0.1:3010;
    www.sozan-core.ir 127.0.0.1:3010;
    app.sozan-core.ir 127.0.0.1:3010;
    api.sozan-core.ir 127.0.0.1:8012;
    include /home/ubuntu/sozan-core/deploy/shop-upstreams.map;
}

map $host $sozan_origin_encoding {
    default "";
    sozan-core.ir $http_accept_encoding;
    www.sozan-core.ir $http_accept_encoding;
    app.sozan-core.ir $http_accept_encoding;
    api.sozan-core.ir $http_accept_encoding;
}

server {
    listen 80;
    listen 8088;
    listen [::]:80;
    listen [::]:8088;
    server_name www.sozan-core.ir;
    return 301 https://sozan-core.ir$request_uri;
}

server {
    listen 80;
    listen 8088;
    listen [::]:80;
    listen [::]:8088;
    server_name sozan-core.ir;

    client_max_body_size 8m;
    keepalive_timeout 75s;

    location = /2326207.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=60, must-revalidate" always;
        charset utf-8;
        return 200 "";
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=60, must-revalidate" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding $sozan_origin_encoding;
    }
}

server {
    listen 80;
    listen 8088;
    listen [::]:80;
    listen [::]:8088;
    server_name app.sozan-core.ir api.sozan-core.ir *.sozan-core.ir;
    include /home/ubuntu/sozan-core/deploy/shop-custom-names.conf;

    # استاتیک Next ویترین‌ها (AT4): مسیر نسخه‌دار روی دامنهٔ اصلی سرو می‌شود.
    location /sozan-assets/ {
        alias /home/ubuntu/site-builder/builds/azmaish-panl/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    client_max_body_size 32m;
    keepalive_timeout 75s;
    server_tokens off;

    error_page 503 @shopclosed;
    location @shopclosed {
        internal;
        root /var/lib/sozan-core;
        try_files /shop-closed.html =503;
    }

    location = /shop-closed.html {
        internal;
        root /var/lib/sozan-core;
    }

    location = /sozan-preview-beacon.js {
        alias /var/lib/sozan-core/sozan-preview-beacon.js;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=30";
    }

    location / {
        if ($sozan_upstream = "") {
            return 503;
        }
        proxy_pass http://$sozan_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 90s;
        proxy_send_timeout 210s;
        proxy_read_timeout 210s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-cache, no-store, max-age=0, must-revalidate" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding $sozan_origin_encoding;
        proxy_hide_header X-Frame-Options;
        sub_filter '</body>' '<script src="/sozan-preview-beacon.js?v=live1" defer></script></body>';
        sub_filter_once on;
    }
}

server {
    listen 80;
    listen 8088;
    listen [::]:80;
    listen [::]:8088;
    server_name status.sozan-core.ir;
    server_tokens off;

    location / {
        root /home/ubuntu/sozan-status;
        try_files /status.html =503;
        default_type text/html;
        auth_basic "Sozan Status";
        auth_basic_user_file /etc/nginx/.sozan-status-htpasswd;
        add_header Cache-Control "no-store" always;
    }
}
